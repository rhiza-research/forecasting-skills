[build-system]
requires = ["hatchling", "skills-runner"]
build-backend = "hatchling.build"

[project]
name = "forecasting-skills"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies", "scripts"]

[tool.hatch.metadata.hooks.skills-runner]
cli = "forecasting-skills"

[tool.hatch.build.hooks.skills-runner]

[dependency-groups]
dev = [
    "pytest>=8",
    "numpy>=2.4",
    "xarray>=2026.4",
    "cftime>=1.6",
    "zarr>=3.2",
]

[tool.uv.sources]
skills-runner = { git = "https://github.com/tescalada/skills-runner" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
