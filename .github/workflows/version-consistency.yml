name: Version consistency

# Skill version lives in SKILL.md `metadata.version` (Agent Skills spec) and
# a paired `_SKILL_VERSION` constant in scripts. This check verifies they
# agree for every skill.

on:
  pull_request:
    # Exclude draft PRs: contributors often push WIP commits while they
    # iterate. The check still runs as soon as the PR is marked ready for
    # review.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Skip draft PRs explicitly. The `types:` filter above already drops
    # `synchronize` events on drafts in some cases, but a draft can be
    # opened directly (e.g. via `gh pr create --draft`), and the `opened`
    # event fires regardless. This `if:` is the canonical guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv run --script tools/check_version_consistency.py .
