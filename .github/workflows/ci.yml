name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uvx ruff format --check
      - run: uvx ruff check

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          matrix=$(find skills -mindepth 3 -maxdepth 3 -path '*/scripts/*' -name '*.py' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map(split("/") | {skill: .[1], script: .[3]})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  script-help:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv run --script skills/${{ matrix.skill }}/scripts/${{ matrix.script }} --help
