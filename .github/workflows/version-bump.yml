name: Version bump

# Trigger: every push to main, including post-merge pushes from the
# merge button. The job inspects the push diff for changed skill
# directories and bumps each affected skill's SKILL.md `version:`.
#
# Recursion: the bump commit this workflow itself creates carries
# `[skip ci]` in its subject so the downstream push of that commit
# does not re-trigger this workflow (or CI). The push uses a token
# minted from a GitHub App installation (via
# actions/create-github-app-token) so that *other* workflows could,
# if needed, see the push event — but the `[skip ci]` marker prevents
# this workflow from recursing regardless of token.

on:
  push:
    branches: [main]

concurrency:
  # Serialize bump runs on main so two near-simultaneous merges don't
  # race when computing diffs against `github.event.before`.
  group: version-bump-main
  cancel-in-progress: false

jobs:
  # Pre-step: normalize the head-commit message (strip trailing whitespace
  # and newlines) and expose two booleans the bump job uses for its `if`.
  # GitHub Actions expression syntax has no regex, and `endsWith` on the raw
  # message misses commits whose subject ends with `[skip ci]\n` (a trailing
  # newline after the marker). Normalizing here pulls that fiddly parsing
  # out of an inline expression and into a single shell step where it can be
  # tested unambiguously.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      is_bot: ${{ steps.flags.outputs.is_bot }}
      has_skip_ci: ${{ steps.flags.outputs.has_skip_ci }}
    steps:
      - name: Compute skip-ci and bot flags
        id: flags
        env:
          HEAD_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Bot author check: the release bot's own bump commits are skipped
          # regardless of subject content, as a belt-and-suspenders to the
          # [skip ci] marker. The email matches GitHub's convention for an
          # App-bot user: "<app-id>+<app-slug>[bot]@users.noreply.github.com".
          if [ "$HEAD_AUTHOR_EMAIL" = "3799090+forecasting-skills-release-bot[bot]@users.noreply.github.com" ]; then
            echo "is_bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_bot=false" >> "$GITHUB_OUTPUT"
          fi
          # Match [skip ci] as a whitespace-delimited token anywhere in
          # the message. "Whitespace" here means a space, tab, newline,
          # or one of the string edges. A simple shell-substring check
          # can't express "any whitespace OR string edge" without a lot
          # of brittle padding, so we delegate to python's `re.search`
          # with `\b`-style boundaries: the token must be preceded by
          # start-of-string or whitespace, and followed by whitespace
          # or end-of-string. This covers `[skip ci]` alone on a line,
          # at the start, at the end (with or without trailing newline),
          # and mid-message, while rejecting substring matches like
          # `no[skip ci]allowed`.
          if printf '%s' "$HEAD_MESSAGE" | python3 -c '
          import re, sys
          msg = sys.stdin.read()
          if re.search(r"(?:\A|\s)\[skip ci\](?:\s|\Z)", msg):
              sys.exit(0)
          sys.exit(1)
          '; then
            echo "has_skip_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_skip_ci=false" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: preflight
    if: needs.preflight.outputs.is_bot != 'true' && needs.preflight.outputs.has_skip_ci != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout main at pushed sha
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Branch protection requires linear history on main (see
          # CONTRIBUTING.md), so the push range is a clean linear sequence
          # of commits. A full unshallow is still cheap and avoids any
          # edge case where a force-push extends the range further than
          # depth 2 would cover.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          # The App token authenticates as the App, so the bump commit
          # is authored as the App's bot user. The committer email
          # follows GitHub's convention for App-bot users:
          # "<app-id>+<app-slug>[bot]@users.noreply.github.com".
          git config user.name "forecasting-skills-release-bot[bot]"
          git config user.email "3799090+forecasting-skills-release-bot[bot]@users.noreply.github.com"

      - name: Identify changed skill directories
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # github.event.before is "0000...0000" when the branch is new
          # (the inaugural push). In that case prefer diffing against
          # the parent of HEAD; if HEAD has no parent (the very first
          # commit in the repo), list every file in HEAD itself so the
          # inaugural commit's skills still get bumped.
          #
          # Pathspec note: git pathspecs are not true globs. `skills/*/*`
          # is interpreted as "any file at or below `skills/<one-segment>/`",
          # so it matches `skills/foo/SKILL.md`, `skills/foo/scripts/bar.py`,
          # AND `skills/foo/scripts/sub/deep.py` — both git diff and
          # git diff-tree apply this consistently. The `awk` afterwards
          # only reads `$2` (the skill directory) and feeds `sort -u`,
          # so depth beyond `skills/<skill>/` doesn't change which skills
          # are reported, only whether their nested file changes are
          # observed at all.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if parent=$(git rev-parse --verify --quiet "${AFTER_SHA}^"); then
              BEFORE_SHA="$parent"
              changed=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'skills/*/*' \
                | awk -F/ 'NF >= 2 && $1 == "skills" { print $2 }' \
                | sort -u)
            else
              echo "HEAD has no parent (fresh repo); listing files in HEAD."
              changed=$(git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" -- 'skills/*/*' \
                | awk -F/ 'NF >= 2 && $1 == "skills" { print $2 }' \
                | sort -u)
            fi
          else
            changed=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'skills/*/*' \
              | awk -F/ 'NF >= 2 && $1 == "skills" { print $2 }' \
              | sort -u)
          fi
          if [ -z "$changed" ]; then
            echo "No skill directories changed; exiting cleanly."
            echo "skills=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed skills:"
            printf '  %s\n' $changed
            # Join with newlines and emit as a multiline output.
            {
              echo "skills<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump kind from merged PR labels
        id: kind
        if: steps.changed.outputs.skills != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Look up the PR(s) that introduced this commit. The endpoint
          # is "List pull requests associated with a commit"; the
          # `groot-preview` accept header is no longer required (the
          # endpoint left preview in 2019).
          #
          # Distinguish three outcomes:
          #   - success with a non-empty PR list: read labels from PR[0]
          #   - success with an empty PR list: no PR is associated with
          #     the commit (direct push to main, manual bump, ...). Log
          #     and default to patch.
          #   - failure (network, auth, 5xx): log the captured error
          #     output and default to patch. Don't silently swallow.
          if pr_json="$(gh api "repos/${REPO}/commits/${SHA}/pulls" 2>&1)"; then
            : # success; pr_json holds the JSON body
          else
            rc=$?
            echo "gh api failed (exit $rc): $pr_json" >&2
            echo "Defaulting to patch; labels not consulted." >&2
            pr_json="[]"
          fi
          # Log "no PR associated" explicitly, so a maintainer reading
          # the run can distinguish that case from "PR exists but had
          # no labels".
          if printf '%s' "$pr_json" \
            | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin) else 1)'; then
            : # at least one PR; nothing to log here
          else
            echo "No PR associated with ${SHA}; defaulting to patch." >&2
          fi
          # Take the labels from the first associated PR (there will
          # typically be exactly one for a merge into main).
          labels=$(printf '%s' "$pr_json" | python3 -c 'import json, sys
          data = json.load(sys.stdin)
          if data:
              for label in data[0].get("labels", []):
                  name = label.get("name", "")
                  if name:
                      print(name)
          ')
          # Log the observed labels so we can distinguish "PR had no
          # labels" from "PR had labels but none matched release:*".
          # Quote "$labels" and use sed (not printf word-splitting) so
          # label names that contain spaces don't get split across log
          # lines.
          if [ -z "$labels" ]; then
            echo "Labels: (none)"
          else
            echo "Labels:"
            echo "$labels" | sed 's/^/  /'
          fi
          # Highest-precedence release: label wins (major > minor > patch).
          # The order of these checks encodes that precedence — if a PR
          # carries both `release: major` and `release: minor`, the major
          # bump is applied.
          kind=patch
          if printf '%s\n' "$labels" | grep -qx 'release: major'; then
            kind=major
            echo "Multiple release: labels may be present; major has highest precedence and wins."
          elif printf '%s\n' "$labels" | grep -qx 'release: minor'; then
            kind=minor
            echo "release: minor selected (no release: major present)."
          fi
          echo "Bump kind: $kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Bump each affected skill and stage changes
        id: bump
        if: steps.changed.outputs.skills != ''
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          # Read the changed-skill list from an env var rather than
          # interpolating `${{ ... }}` straight into the shell body. A
          # skill name (or any output captured from a third-party action)
          # that contained shell metacharacters would otherwise be a
          # template-injection sink. The env-var path quotes the value
          # at the runner level and reaches the shell as $SKILLS only.
          SKILLS: ${{ steps.changed.outputs.skills }}
        run: |
          set -euo pipefail
          # Collect "<skill>: <old> -> <new>" lines into a build-up file
          # that the next step turns into the commit body. The file lives
          # under $RUNNER_TEMP so it never accidentally lands inside the
          # repo working tree (which would otherwise be staged by a
          # broad `git add` and shipped in the bump commit).
          bumps_file="${RUNNER_TEMP}/bumps.txt"
          : > "$bumps_file"
          # Helper: read the current `metadata.version` value from a
          # SKILL.md by delegating to the shared parser in tools/. The
          # python invocation imports `find_metadata_version_line` so the
          # YAML walk stays identical to the bump script's view; a
          # divergent inline regex here would risk reading from the
          # wrong key (e.g. a top-level `version:` rather than the
          # nested `metadata.version`).
          read_version() {
            local skill="$1"
            python3 - "$skill" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from rhiza_version_re import find_metadata_version_line  # noqa: E402

          skill = sys.argv[1]
          text = Path("skills") / skill / "SKILL.md"
          content = text.read_text(encoding="utf-8")
          if not content.startswith("---"):
              raise SystemExit(f"{text}: no YAML frontmatter")
          end = content.find("\n---", 3)
          if end < 0:
              raise SystemExit(f"{text}: no closing --- for frontmatter")
          front = content[3:end].split("\n")
          _, raw, _ = find_metadata_version_line(front)
          # Strip matching surrounding quotes (single or double) so the
          # printed value is the bare semver string.
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
              raw = raw[1:-1]
          print(raw)
          PY
          }
          while IFS= read -r skill; do
            [ -z "$skill" ] && continue
            if [ ! -f "skills/${skill}/SKILL.md" ]; then
              echo "Skipping ${skill}: no SKILL.md (likely a deletion)"
              continue
            fi
            old_version=$(read_version "$skill")
            # The bump script updates SKILL.md AND every script's
            # _SKILL_VERSION constant for this skill in one shot.
            python3 .github/scripts/bump-skill-version.py --skill "$skill" --kind "$KIND"
            new_version=$(read_version "$skill")
            # Stage the whole skill directory so the bump-script's edits
            # to scripts/*.py (the _SKILL_VERSION constant) are
            # committed alongside SKILL.md. Staging only SKILL.md would
            # silently drop the constant rewrite.
            git add "skills/${skill}/"
            printf -- '- %s: %s -> %s\n' "$skill" "$old_version" "$new_version" >> "$bumps_file"
          done <<< "$SKILLS"
          # Report the count to a step output so the commit step can
          # decide whether there's anything to commit. The build-up file
          # path is also exported so the commit step reads from the same
          # location without re-deriving it.
          bump_count=$(wc -l < "$bumps_file" | tr -d ' ')
          echo "bumps_file=${bumps_file}" >> "$GITHUB_OUTPUT"
          echo "bump_count=${bump_count}" >> "$GITHUB_OUTPUT"
          if [ "$bump_count" -eq 0 ]; then
            echo "No skills bumped (e.g. all changed skill dirs were deletions)."
          else
            echo "Bumped ${bump_count} skill(s):"
            cat "$bumps_file"
          fi

      - name: Create single bump commit
        id: commit
        if: steps.bump.outputs.bump_count != '' && steps.bump.outputs.bump_count != '0'
        env:
          BUMPS_FILE: ${{ steps.bump.outputs.bumps_file }}
        run: |
          set -euo pipefail
          # One commit per workflow run, regardless of how many skills
          # were bumped. The subject carries no version literal because
          # each skill is versioned independently and the bumped set
          # generally lands at heterogeneous versions; the body
          # enumerates each affected skill's old -> new transition.
          git commit \
            -m "release: bump skill versions [skip ci]" \
            -m "$(cat "$BUMPS_FILE")" \
            -m "Auto-generated by .github/workflows/version-bump.yml in response to skill-directory changes in commit ${GITHUB_SHA}."

      - name: Push bump commit
        if: steps.bump.outputs.bump_count != '' && steps.bump.outputs.bump_count != '0'
        run: |
          set -euo pipefail
          # Push to main. The push uses the App-minted token obtained
          # by the checkout step (see CONTRIBUTING.md for App setup).
          # The `[skip ci]` marker on the commit prevents recursion
          # into this workflow.
          #
          # Retry up to 3 times on push contention: another merge can
          # land on main between checkout and push, which would reject
          # this push as non-fast-forward. Rebase locally and retry.
          # If still failing after the third attempt, fail the job
          # rather than silently dropping the bump.
          attempts=0
          max_attempts=3
          while true; do
            attempts=$((attempts + 1))
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempts}."
              break
            fi
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "Push failed after ${attempts} attempts; giving up." >&2
              # If a partial rebase is still in progress (the last
              # `git pull --rebase` left conflicts unresolved), surface
              # the conflicting paths so the maintainer can act.
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                echo "Partial rebase still in progress; conflicting paths:" >&2
                git diff --name-only --diff-filter=U >&2 || true
                git rebase --abort 2>/dev/null || true
              fi
              exit 1
            fi
            echo "Push rejected (likely contention); rebasing onto origin/main and retrying (${attempts}/${max_attempts})." >&2
            git fetch origin main
            # Defensive: if a previous attempt left a partial rebase
            # behind (conflicts the auto-rebase couldn't resolve), abort
            # it before starting a fresh pull --rebase. Without this, the
            # next `git pull --rebase` would fail with "rebase in progress".
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo "Aborting prior partial rebase before retry." >&2
              git rebase --abort 2>/dev/null || true
            fi
            if ! git pull --rebase origin main; then
              echo "git pull --rebase failed; aborting partial rebase and retrying." >&2
              echo "Conflicting paths (if any):" >&2
              git diff --name-only --diff-filter=U >&2 || true
              git rebase --abort 2>/dev/null || true
            fi
          done

  # After a real merge (skill bump and/or agent change), publish a lean copy of
  # just the plugin to the `plugin-dist` branch: the manifest, the agent,
  # skills/, and LICENSE -- nothing else from the repo (no demo/, tools/, CI, or
  # tests).
  # marketplace.json sources the rhiza-forecasting plugin from this branch, so
  # installs never pull the repo's non-runtime content. One appended commit per
  # merge (no force-push). The published manifest carries a `version` stamped by
  # this job; the repo's own plugin.json has no `version` key.
  #
  # Sequencing: `needs: bump` so this runs after the bump commit lands, and the
  # checkout takes main's latest tip to capture it. The bot's `[skip ci]` bump
  # commit is gated out by the same preflight flags, so plugin-dist is rebuilt
  # exactly once per real merge, not again for the bump commit.
  dist:
    needs: [preflight, bump]
    if: needs.preflight.outputs.is_bot != 'true' && needs.preflight.outputs.has_skip_ci != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout main at its latest tip
        uses: actions/checkout@v4
        with:
          # `main`, not github.sha: the `bump` job may have just pushed a
          # skill-version bump commit, and plugin-dist must reflect it.
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Publish curated plugin payload to plugin-dist
        run: |
          set -euo pipefail
          git config user.name "forecasting-skills-release-bot[bot]"
          git config user.email "3799090+forecasting-skills-release-bot[bot]@users.noreply.github.com"

          # Stage exactly the plugin payload from main: manifest, agent, skills,
          # and the LICENSE whose terms the manifest declares. Nothing else in
          # the repo is copied, so the published plugin never carries demo/,
          # tools/, CI, or tests.
          stage="${RUNNER_TEMP}/plugin-payload"
          rm -rf "$stage"
          mkdir -p "$stage/.claude-plugin" "$stage/agents"
          cp .claude-plugin/plugin.json "$stage/.claude-plugin/plugin.json"
          cp agents/forecaster.md "$stage/agents/forecaster.md"
          cp LICENSE "$stage/LICENSE"
          cp -R skills "$stage/skills"

          # Check out plugin-dist in a separate worktree so the main checkout is
          # untouched. Base on the branch's current tip for a fast-forward
          # append; create it as an orphan on the first run.
          worktree="${RUNNER_TEMP}/plugin-dist-wt"
          rm -rf "$worktree"
          if git ls-remote --exit-code --heads origin plugin-dist >/dev/null 2>&1; then
            git fetch origin plugin-dist:plugin-dist
            git worktree add "$worktree" plugin-dist
          else
            git worktree add --detach "$worktree"
            git -C "$worktree" checkout --orphan plugin-dist
          fi

          # Writes `version` into a manifest, leaving the file untouched when the
          # version is empty (first publish, before anything has been stamped).
          stamp_version() {
            python3 -c '
          import json
          import sys

          path, version = sys.argv[1], sys.argv[2]
          if not version:
              sys.exit(0)
          with open(path) as fh:
              manifest = json.load(fh)
          manifest["version"] = version
          with open(path, "w") as fh:
              fh.write(json.dumps(manifest, indent=2) + "\n")
          ' "$1" "$2"
          }

          # The version currently on plugin-dist. Deriving the next version from
          # what actually shipped keeps the sequence monotonic by construction.
          # github.run_number is not a substitute: GitHub documents it only as
          # "a unique number for each run of a particular workflow in a
          # repository", beginning at 1 for that workflow's first run and
          # incrementing with each new run. Nothing in that definition
          # guarantees the counter never restarts, and a restart would publish a
          # lower version and silently cut off updates for every installed user.
          #
          # Three outcomes are distinguished:
          #   - exit 0: the manifest parsed; stdout is the version (empty when
          #     the manifest carries no `version` key).
          #   - exit 3: a `version` key is present but is not a JSON string.
          #     `null` counts: a present key whose value is not a string is
          #     non-conforming whatever the value, so the job fails below rather
          #     than guessing. Only an absent key means "nothing published".
          #   - exit 4: the manifest is unreadable, is not parseable JSON, or
          #     parses to something other than a JSON object. (A manifest that
          #     does not exist is handled by the `[ -f ]` guard around this
          #     block and never reaches the parser.) Treated as "no published
          #     version" with a loud warning: a hard failure here would wedge
          #     every subsequent run identically until someone repaired the
          #     branch by hand.
          published=""
          manifest="$worktree/.claude-plugin/plugin.json"
          if [ -f "$manifest" ]; then
            if published="$(python3 - "$manifest" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1]) as fh:
                  manifest = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"{sys.argv[1]}: {exc}", file=sys.stderr)
              raise SystemExit(4) from None
          if not isinstance(manifest, dict):
              print(f"{sys.argv[1]}: top-level JSON value is not an object", file=sys.stderr)
              raise SystemExit(4)
          # Key presence, not truthiness of the value: `"version": null` is a
          # present key carrying a non-string, which is non-conforming and must
          # fail like any other non-string type. Only an absent key means
          # nothing has been published yet.
          if "version" not in manifest:
              print("")
          else:
              version = manifest["version"]
              if isinstance(version, str):
                  print(version)
              else:
                  # json.dumps so the message names the offending value in the
                  # JSON spelling the file uses (`null`, `true`, `[]`) rather
                  # than its Python repr.
                  print(
                      f"{sys.argv[1]}: version is {json.dumps(version)}, not a JSON string",
                      file=sys.stderr,
                  )
                  raise SystemExit(3)
          PY
          )"; then
              read_rc=0
            else
              read_rc=$?
            fi
            case "$read_rc" in
              0) ;;
              3)
                echo "::error::The plugin version published on plugin-dist is not a JSON string (see the message above). Refusing to publish: a version derived from it could go backwards and strand every installed user. Repair .claude-plugin/plugin.json on the plugin-dist branch."
                exit 1
                ;;
              4)
                echo "::warning::Could not read the plugin version published on plugin-dist (see the message above). Continuing as if nothing were published, which may republish a version lower than the unreadable one. Repair .claude-plugin/plugin.json on the plugin-dist branch."
                published=""
                ;;
              *)
                echo "::error::Reading the published plugin version failed unexpectedly (exit ${read_rc})."
                exit 1
                ;;
            esac
          fi

          # A non-empty published version must be exactly three numeric
          # components. Anything else (a suffix like `-hotfix`, a stray space, a
          # missing component) is rejected rather than treated as unset: falling
          # through to `<today>.0` can produce a version LOWER than what is
          # published, which permanently strands every installed user.
          if ! python3 - "$published" <<'PY'
          import sys

          published = sys.argv[1]
          if not published:
              raise SystemExit(0)
          parts = published.split(".")
          if len(parts) != 3 or not all(p.isascii() and p.isdigit() for p in parts):
              print(
                  f"::error::The plugin version published on plugin-dist is {published!r}, "
                  "which is not <year>.<mmdd>.<counter> with three numeric components. "
                  "Refusing to publish: a version derived from it could go backwards and "
                  "strand every installed user. Repair .claude-plugin/plugin.json on the "
                  "plugin-dist branch."
              )
              raise SystemExit(1)
          PY
          then
            exit 1
          fi

          # Version scheme: <year>.<month*100+day>.<counter>, e.g. 2026.721.0.
          # Major sorts by year, minor by MMDD as a plain integer, and the
          # counter breaks ties between two publishes on the same day. If the
          # published version is dated at or ahead of today, its date is kept and
          # the counter advanced, so the value never decreases.
          next_version="$(python3 -c '
          import datetime
          import sys

          prev = sys.argv[1].split(".")
          now = datetime.datetime.now(datetime.timezone.utc)
          today = (now.year, now.month * 100 + now.day)
          if len(prev) == 3 and all(part.isdigit() for part in prev):
              year, mmdd, counter = (int(part) for part in prev)
              if (year, mmdd) >= today:
                  print(f"{year}.{mmdd}.{counter + 1}")
                  sys.exit(0)
          print(f"{today[0]}.{today[1]}.0")
          ' "$published")"

          # Compare under the version already published, so the version field
          # itself cannot be what differs. Without this the payload would change
          # on every run and a docs-only merge would publish a pointless commit.
          stamp_version "$stage/.claude-plugin/plugin.json" "$published"

          # Replace tracked content with the staged payload, then commit only if
          # something actually changed.
          cd "$worktree"
          git rm -rfq . >/dev/null 2>&1 || true
          cp -R "$stage"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "plugin-dist already current; nothing to publish."
            exit 0
          fi

          # Something did change, so this is a real publish: stamp the new
          # version and re-stage.
          stamp_version .claude-plugin/plugin.json "$next_version"
          git add -A

          # Validate exactly what is about to ship. Run it from the worktree: at
          # the repo root the sibling marketplace.json is picked up instead and
          # the plugin manifest goes unchecked. Node and npm come with the runner
          # image, so npx needs no setup-node and installs nothing persistent.
          #
          # Retry a few times: npx resolves the pinned package from the npm
          # registry on every run, so a transient registry error would otherwise
          # fail a release whose payload is fine. A payload that genuinely fails
          # --strict fails all three attempts and then fails the job.
          #
          # Each attempt is wrapped in `timeout` (coreutils, in the runner
          # image's apt package set) so the retry loop has a bound the job's
          # 5-minute timeout-minutes cannot be exceeded by. Without it, an npx
          # that hangs against a degraded registry consumes the whole job budget
          # inside one attempt and the job is killed mid-command with no
          # diagnostic. The retry sleeps are not the dominant cost -- each
          # attempt re-resolves and re-downloads the pinned package, which is
          # what runs long when the registry is slow.
          #
          # Worst-case wall clock for the loop: 3 attempts x 60s, plus 2 sleeps
          # of 10s, is 200s. That leaves ~100s of the job's 300s budget for
          # checkout, the worktree setup, and the push. A healthy registry
          # resolves and validates in a few seconds, so 60s is a wide margin
          # around the normal case rather than a tight fit. `timeout` exits 124
          # when it fires, which the loop treats as a failed attempt like any
          # other non-zero exit.
          validate_attempts=0
          validate_max_attempts=3
          until timeout 60 npx -y @anthropic-ai/claude-code@2.1.216 plugin validate . --strict; do
            validate_attempts=$((validate_attempts + 1))
            if [ "$validate_attempts" -ge "$validate_max_attempts" ]; then
              echo "::error::plugin validate failed on all ${validate_attempts} attempts; not publishing."
              exit 1
            fi
            echo "plugin validate failed; retrying in 10s (${validate_attempts}/${validate_max_attempts})." >&2
            sleep 10
          done

          git commit -m "release: publish plugin ${next_version} from ${GITHUB_SHA}"
          # Tag the payload commit with its version. This runs only on a real
          # publish -- the no-op `exit 0` above returns before reaching here
          # when the payload is unchanged, so no tag is ever created for a
          # no-op run. Nothing in this workflow consumes the tag; it exists so
          # a release can later be cut from the exact published payload.
          git tag -a -m "plugin ${next_version}" "plugin-v${next_version}"
          # Append-only: no --force. The branch update fast-forwards because the
          # commit is based on plugin-dist's tip (or the branch is new).
          # --atomic pushes the branch and the tag as a single unit: both refs
          # update or neither does. Without it, the branch could publish while
          # the tag ref is rejected, leaving a published-but-untagged version.
          git push --atomic origin plugin-dist "plugin-v${next_version}"
